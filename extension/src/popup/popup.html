<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Verification</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 420px;
        max-height: 600px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
        font-size: 13px;
        background: #0f172a;
        color: #e2e8f0;
      }

      .header {
        padding: 12px 16px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
        color: #f1f5f9;
      }

      /* Verification Status */
      .verification-status {
        padding: 12px 16px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      }

      .verification-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .verification-badge.verified {
        background: #065f46;
        color: #6ee7b7;
      }

      .verification-badge.partial {
        background: #854d0e;
        color: #fde047;
      }

      .verification-badge.failed {
        background: #7f1d1d;
        color: #fca5a5;
      }

      .verification-badge.loading {
        background: #1e3a5f;
        color: #7dd3fc;
      }

      .verification-badge.not-ens {
        background: #334155;
        color: #94a3b8;
      }

      .verification-info {
        font-size: 11px;
        color: #94a3b8;
      }

      .verification-info .domain {
        color: #7dd3fc;
        font-family: "SF Mono", Monaco, Consolas, monospace;
      }

      .verification-info .cid {
        color: #64748b;
        font-family: "SF Mono", Monaco, Consolas, monospace;
        font-size: 10px;
        word-break: break-all;
        margin-top: 4px;
      }

      .verification-stats {
        display: flex;
        gap: 16px;
        margin-top: 8px;
        font-size: 11px;
      }

      .verification-stats .stat {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .verification-stats .stat.verified { color: #6ee7b7; }
      .verification-stats .stat.failed { color: #fca5a5; }
      .verification-stats .stat.pending { color: #94a3b8; }

      .no-data {
        padding: 40px 16px;
        text-align: center;
        color: #64748b;
      }

      .file-list {
        max-height: 400px;
        overflow-y: auto;
      }

      .file-item {
        padding: 10px 16px;
        border-bottom: 1px solid #1e293b;
        transition: background 0.15s;
      }

      .file-item:hover {
        background: #1e293b;
      }

      .file-item.verified {
        border-left: 3px solid #10b981;
      }

      .file-item.failed {
        border-left: 3px solid #ef4444;
      }

      .file-item.pending {
        border-left: 3px solid #64748b;
      }

      .file-path {
        font-family: "SF Mono", Monaco, Consolas, monospace;
        font-size: 12px;
        color: #7dd3fc;
        word-break: break-all;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .file-path .status-icon {
        font-size: 14px;
      }

      .file-hash {
        font-family: "SF Mono", Monaco, Consolas, monospace;
        font-size: 10px;
        color: #64748b;
        word-break: break-all;
      }

      .file-meta {
        display: flex;
        gap: 12px;
        margin-top: 4px;
        font-size: 11px;
        color: #64748b;
      }

      .refresh-btn {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }

      .refresh-btn:hover {
        background: #2563eb;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #1e293b;
      }

      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Frontend Verification</h1>
      <button class="refresh-btn" id="refresh-btn">Refresh</button>
    </div>

    <div id="verification-status" class="verification-status">
      <div class="verification-badge loading">
        <span>⏳</span> Checking...
      </div>
    </div>

    <div id="verification-content">
      <div class="no-data">Loading verification data...</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
